# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

vars:
  aws_account_id:
    sh: aws sts get-caller-identity --query "Account" --output text
  aws_region:
    sh: aws configure get region
  repository_name:
    sh: basename -s .git `git config --get remote.origin.url`
  folder_name:
    sh: basename `pwd`

tasks:
  variables:
    desc: Display the current variables
    cmds:
      - 'echo "AWS Account ID: {{.aws_account_id}}"'
      - 'echo "aws_region: {{.aws_region}}"'
      - 'echo "repository_name: {{.repository_name}}"'
      - 'echo "folder_name: {{.folder_name}}"'
    silent: true

  validate:
    desc: Validate the Terraform configuration
    cmds:
      - cd infrastructure && terraform fmt -check -recursive -diff
    silent: true

  init:
    desc: Perform initialization tasks
    cmds:
      - |
       cd infrastructure && terraform init \
         -backend-config="bucket={{.aws_account_id}}-{{.aws_region}}-terraform-state" \
         -backend-config="key={{.repository_name}}-{{.folder_name}}" \
         -backend-config="region={{.aws_region}}"
    silent: true

  plan:
    desc: Generate and show an execution plan
    deps:
      - init
    cmds:
      - |
        cd infrastructure && terraform plan \
          -var="aws_region={{.aws_region}}" \
          -var="project={{.repository_name}}"
    silent: true

  apply:
    desc: Apply the changes required to reach the desired state of the configuration
    deps:
      - init
    cmds:
       - |
        cd infrastructure && terraform apply -auto-approve \
          -var="aws_region={{.aws_region}}" \
          -var="project={{.repository_name}}"
    silent: true

  destroy:
    desc: Destroy the Terraform-managed infrastructure
    deps:
      - init
    cmds:
      - |
        cd infrastructure && terraform plan -destroy \
          -var="aws_region={{.aws_region}}" \
          -var="project={{.repository_name}}"
      - |    
        cd infrastructure && terraform apply -destroy -auto-approve \
          -var="aws_region={{.aws_region}}" \
          -var="project={{.repository_name}}"
    silent: true

  console:
    desc: Start an interactive Terraform session
    deps:
      - init
    cmds:
       - |
        cd infrastructure && terraform console \
          -var="aws_region={{.aws_region}}" \
          -var="project={{.repository_name}}"
    silent: true
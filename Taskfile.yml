# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:
  apply:
    desc: Call all the apply sub-tasks in the correct order
    cmds:
      - cd terraform_s3_state && task apply
      - cd network && task apply
      - cd iam && task apply
      - cd eks && task apply
      - cd access && task apply
      - cd bootstrap && task apply
    silent: true

  destroy:
    desc: Call all the destroy sub-tasks in the correct order
    cmds:
      - cd bootstrap && task destroy
      - cd access && task destroy
      - cd eks && task destroy
      - cd iam && task destroy
      - cd network && task destroy
    silent: true
